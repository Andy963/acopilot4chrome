name: release

# Tag-triggered releases.
#   * Pre-release channel (dev): tags like v0.0.2, or any tag with a
#     pre-release suffix such as v0.1.0-rc.1  ->  published as a pre-release.
#   * Formal channel (main): clean tags like v0.1.0, v0.2.0, v1.0.0
#     ->  published as a full release.
# The tagged commit's version is synced from the tag before building, so the
# packaged manifest version always matches the tag.
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Sync version from tag
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Package extension
        run: pnpm zip

      - name: Determine release channel
        id: channel
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$version" == *-* || "$version" == 0.0.* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Channel: pre-release ($version)"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Channel: formal release ($version)"
          fi

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ steps.channel.outputs.prerelease }}" == "true" ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "Acopilot4chrome ${GITHUB_REF_NAME}" \
            --generate-notes \
            "${flags[@]}" \
            .output/*-chrome.zip
